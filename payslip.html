<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var origFetch = window.fetch;
        var curFetch = origFetch ? origFetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() { return curFetch; },
          set: function(v) { curFetch = v; }
        });
        if (typeof Window !== 'undefined' && Window.prototype) {
          Object.defineProperty(Window.prototype, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return curFetch; },
            set: function(v) { curFetch = v; }
          });
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Payslip — HCM Lite</title>
  <meta name="description" content="Generate and print detailed monthly salary slip with attendance deduction computation.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="app-container">
    <nav id="sidebarMount" class="no-print"></nav>

    <main class="main-wrapper">
      <header id="topbarMount" class="no-print"></header>

      <div class="content-area">
        <!-- Page Header -->
        <div class="page-header no-print">
          <div>
            <h1 class="page-title">Monthly Salary Statement</h1>
            <p class="page-description">Standardized payroll slip reflecting monthly attendance, leaves, and calculated net compensation.</p>
          </div>
          <div class="page-actions">
            <button id="downloadPdfBtn" class="btn btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              <span>Save as PDF</span>
            </button>
            <button id="printPayslipBtn" class="btn btn-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
              <span>Print Slip</span>
            </button>
          </div>
        </div>

        <!-- Payslip Control Bar (No Print) -->
        <div class="panel no-print" style="margin-bottom: 24px;">
          <div class="panel-body" style="padding: 16px 20px;">
            <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
              <div id="adminEmpSelectorWrap" style="flex: 1; min-width: 260px; display: none;">
                <label class="form-label" for="payslipEmployeeSelect">Select Employee</label>
                <select id="payslipEmployeeSelect" class="form-control"></select>
              </div>

              <div style="width: 220px;">
                <label class="form-label" for="payslipMonthSelect">Pay Period Month</label>
                <select id="payslipMonthSelect" class="form-control"></select>
              </div>
            </div>
          </div>
        </div>

        <!-- Rendered Payslip Sheet -->
        <div id="payslipRenderArea">
          <!-- Populated by payslip.js -->
        </div>

      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/payslip.js"></script>
  <script src="js/helper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initPayslipPage();
    });
  </script>
</body>
</html>
