<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var origFetch = window.fetch;
        var curFetch = origFetch ? origFetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() { return curFetch; },
          set: function(v) { curFetch = v; }
        });
        if (typeof Window !== 'undefined' && Window.prototype) {
          Object.defineProperty(Window.prototype, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return curFetch; },
            set: function(v) { curFetch = v; }
          });
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite — Sign In & Setup</title>
  <meta name="description" content="Modern Human Capital Management for attendance, leave management, and employee administration.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-color: var(--page-bg);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-md);
    }
    .auth-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .auth-header .brand-logo {
      justify-content: center;
      font-size: 20px;
      margin-bottom: 12px;
    }
    .auth-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .auth-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .auth-tabs {
      display: flex;
      background-color: var(--surface-muted);
      border-radius: var(--radius-md);
      padding: 3px;
      margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      background-color: var(--surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .demo-callout {
      background-color: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .demo-callout strong {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <!-- Main Auth Card -->
    <div class="auth-card" id="authCard">
      <!-- Content populated dynamically: First-Run Setup OR Standard Login -->
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: var(--text-muted); text-align: center;">
      HCM Lite &middot; Saylani Hackathon 2026 &middot; Beginner Track
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Vanilla Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAuthPage();
    });

    function initAuthPage() {
      const company = getCompany();
      const users = getUsers();
      const hasAdmin = users.some(u => u.role === 'admin');

      // Check if user is already logged in
      const session = getSession();
      if (session && company && hasAdmin) {
        if (session.role === 'admin') {
          window.location.href = 'admin.html';
          return;
        } else if (session.role === 'employee') {
          window.location.href = 'employee.html';
          return;
        }
      }

      const card = document.getElementById('authCard');

      if (!company || !hasAdmin) {
        renderFirstRunSetup(card);
      } else {
        renderLoginForm(card, company);
      }
    }

    // 1. First-Run Setup Wizard
    function renderFirstRunSetup(card) {
      card.innerHTML = `
        <div class="auth-header">
          <div class="brand-logo">
            <div class="brand-badge">H</div>
            <span class="brand-text">HCM <span>Lite</span></span>
          </div>
          <div class="auth-title">Organization Setup</div>
          <div class="auth-sub">Configure your company settings and initial Administrator account.</div>
        </div>

        <form id="firstRunForm">
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--brand); margin-bottom: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px;">
            1. Company Profile
          </div>

          <div class="form-group">
            <label class="form-label" for="setupCompanyName">Company Legal / Brand Name <span class="req">*</span></label>
            <input type="text" id="setupCompanyName" class="form-control" placeholder="e.g. Acme Corporation" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="setupStartTime">Office Start Time <span class="req">*</span></label>
              <input type="time" id="setupStartTime" class="form-control" required value="09:00">
            </div>
            <div class="form-group">
              <label class="form-label" for="setupGrace">Grace Period (mins) <span class="req">*</span></label>
              <input type="number" id="setupGrace" class="form-control" min="0" max="120" required value="15">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="setupQuota">Yearly Leave Quota (days) <span class="req">*</span></label>
            <input type="number" id="setupQuota" class="form-control" min="1" max="100" required value="20">
          </div>

          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--brand); margin-top: 20px; margin-bottom: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px;">
            2. Initial Administrator Account
          </div>

          <div class="form-group">
            <label class="form-label" for="setupAdminName">Admin Full Name <span class="req">*</span></label>
            <input type="text" id="setupAdminName" class="form-control" placeholder="e.g. Jane Doe" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="setupAdminEmail">Admin Corporate Email <span class="req">*</span></label>
            <input type="email" id="setupAdminEmail" class="form-control" placeholder="admin@company.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="setupAdminPassword">Admin Password <span class="req">*</span></label>
            <input type="password" id="setupAdminPassword" class="form-control" placeholder="Choose a secure password" required minlength="4">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 10px;">
            Complete Setup & Launch Dashboard &rarr;
          </button>
        </form>
      `;

      // Handle first run submit
      document.getElementById('firstRunForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const companyName = document.getElementById('setupCompanyName').value.trim();
        const officeStartTime = document.getElementById('setupStartTime').value;
        const graceMinutes = parseInt(document.getElementById('setupGrace').value, 10);
        const yearlyLeaveQuota = parseInt(document.getElementById('setupQuota').value, 10);

        const adminName = document.getElementById('setupAdminName').value.trim();
        const adminEmail = document.getElementById('setupAdminEmail').value.trim().toLowerCase();
        const adminPassword = document.getElementById('setupAdminPassword').value;

        if (!companyName || !adminName || !adminEmail || !adminPassword) {
          showToast('Please fill out all required fields.', 'error');
          return;
        }

        // Save company
        const companyObj = {
          name: companyName,
          officeStartTime: officeStartTime || '09:00',
          graceMinutes: isNaN(graceMinutes) ? 15 : graceMinutes,
          yearlyLeaveQuota: isNaN(yearlyLeaveQuota) ? 20 : yearlyLeaveQuota,
          workingDays: [1, 2, 3, 4, 5] // Monday through Friday
        };
        saveCompany(companyObj);

        // Save admin user
        const adminUser = {
          id: 'USR_ADMIN_01',
          name: adminName,
          email: adminEmail,
          password: adminPassword,
          role: 'admin',
          department: 'Executive',
          designation: 'System Administrator',
          salary: 10000,
          phone: '',
          joiningDate: getTodayDateString()
        };

        const users = getUsers();
        users.push(adminUser);
        saveUsers(users);

        // Log in immediately
        saveSession({
          userId: adminUser.id,
          name: adminUser.name,
          email: adminUser.email,
          role: adminUser.role,
          department: adminUser.department
        });

        showToast('Company and Admin setup completed successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 500);
      });
    }

    // 2. Standard Login Form (Clean, Production Ready)
    function renderLoginForm(card, company) {
      card.innerHTML = `
        <div class="auth-header">
          <div class="brand-logo">
            <div class="brand-badge">H</div>
            <span class="brand-text">HCM <span>Lite</span></span>
          </div>
          <div class="auth-title">Sign in to ${escapeHtml(company.name)}</div>
          <div class="auth-sub">Enter your email and password to access the portal.</div>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address <span class="req">*</span></label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@company.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password <span class="req">*</span></label>
              <button type="button" id="togglePasswordBtn" style="background: none; border: none; font-size: 11.5px; color: var(--brand); cursor: pointer;">Show</button>
            </div>
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <div id="loginErrorBox" style="display: none; padding: 10px 12px; background-color: var(--danger-soft); border: 1px solid var(--danger); border-radius: var(--radius-md); font-size: 12.5px; color: var(--danger); margin-bottom: 14px;"></div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 13.5px;">
            Sign In &rarr;
          </button>
        </form>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 16px;">
          <button type="button" id="resetAppBtn" style="background: none; border: none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; text-decoration: underline;">
            Reset Company Setup / Clear Data
          </button>
        </div>
      `;

      // Password toggle
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passInput = document.getElementById('loginPassword');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          if (passInput.type === 'password') {
            passInput.type = 'text';
            toggleBtn.textContent = 'Hide';
          } else {
            passInput.type = 'password';
            toggleBtn.textContent = 'Show';
          }
        });
      }

      // Handle login form submit
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorBox = document.getElementById('loginErrorBox');

        const result = login(email, password);
        if (!result.success) {
          errorBox.textContent = result.message;
          errorBox.style.display = 'block';
          return;
        }

        errorBox.style.display = 'none';
        showToast(`Welcome back, ${result.user.name}!`, 'success');

        setTimeout(() => {
          if (result.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'employee.html';
          }
        }, 400);
      });

      // Reset button
      document.getElementById('resetAppBtn').addEventListener('click', () => {
        if (confirm('Permanently clear all organization data and return to setup?')) {
          resetAllData();
          showToast('Data cleared.', 'info');
          initAuthPage();
        }
      });
    }
  </script>
</body>
</html>
